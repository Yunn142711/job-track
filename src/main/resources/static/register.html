<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JobTrack | 新規登録</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: "Segoe UI", "Noto Sans JP", Arial, sans-serif;
    background: #f5f8f7;
    color: #203331;
    min-height: 100vh;
    display: grid;
    place-items: center;
}

.register-card {
    width: min(420px, 92vw);
    background: #fff;
    border: 1px solid #e3ebe9;
    border-radius: 22px;
    padding: 36px;
    box-shadow: 0 14px 40px rgba(24,70,65,.10);
}

.logo {
    text-align: center;
    font-size: 31px;
    font-weight: 800;
    color: #147d73;
    margin-bottom: 8px;
}

.logo span {
    color: #203331;
}

.sub {
    text-align: center;
    color: #71807e;
    margin: 0 0 28px;
}

.group {
    margin-bottom: 18px;
}

.group label {
    display: block;
    font-weight: 700;
    margin-bottom: 8px;
}

.input {
    width: 100%;
    padding: 13px 14px;
    border: 1px solid #e3ebe9;
    border-radius: 11px;
    outline: none;
    font-size: 15px;
}

.input:focus {
    border-color: #147d73;
}

.btn {
    width: 100%;
    border: 0;
    border-radius: 11px;
    padding: 13px;
    cursor: pointer;
    font-weight: 800;
    background: #147d73;
    color: #fff;
    font-size: 15px;
}

.btn:hover {
    background: #0d625b;
}

.message {
    display: none;
    padding: 11px;
    border-radius: 10px;
    margin-bottom: 16px;
    text-align: center;
}

.error {
    color: #c0392b;
    background: #fff0ef;
}

.success {
    color: #0d625b;
    background: #e7f5f2;
}

.login-link {
    margin-top: 20px;
    text-align: center;
    font-size: 14px;
    color: #71807e;
}

.login-link a {
    color: #147d73;
    font-weight: 700;
    text-decoration: none;
    margin-left: 5px;
}

.login-link a:hover {
    text-decoration: underline;
}
</style>
</head>

<body>

<div class="register-card">

    <div class="logo">
        Job<span>Track</span>
    </div>

    <p class="sub">新規アカウント登録</p>

    <div id="error" class="message error"></div>

    <div id="success" class="message success">
        登録しました！
    </div>

    <form id="registerForm">

        <div class="group">
            <label>ユーザー名</label>
            <input
                id="username"
                class="input"
                required
                autocomplete="username"
                placeholder="ユーザー名を入力"
            >
        </div>

        <div class="group">
            <label>パスワード</label>
            <input
                id="password"
                type="password"
                class="input"
                required
                autocomplete="new-password"
                placeholder="パスワードを入力"
            >
        </div>

        <div class="group">
            <label>パスワード（確認）</label>
            <input
                id="passwordConfirm"
                type="password"
                class="input"
                required
                autocomplete="new-password"
                placeholder="もう一度入力"
            >
        </div>

        <button class="btn" type="submit">
            新規登録
        </button>

    </form>

    <div class="login-link">
        すでにアカウントをお持ちの方は
        <a href="/login.html">ログイン</a>
    </div>

</div>

<script>

document.getElementById("registerForm").addEventListener("submit", async function(e) {

    e.preventDefault();

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value;

    const passwordConfirm =
        document.getElementById("passwordConfirm").value;

    const error =
        document.getElementById("error");

    const success =
        document.getElementById("success");

    error.style.display = "none";
    success.style.display = "none";

    // パスワード確認
    if (password !== passwordConfirm) {

        error.textContent =
            "パスワードが一致していません。";

        error.style.display = "block";

        return;
    }

    try {

        const response = await fetch("/auth/register", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                username: username,
                password: password
            })
        });

        const result = await response.text();

        if (result === "OK") {

            success.textContent =
                "登録しました！ログイン画面へ移動します。";

            success.style.display = "block";

            setTimeout(function() {
                window.location.href = "/login.html";
            }, 1200);

        } else if (result === "EXISTS") {

            error.textContent =
                "このユーザー名はすでに使用されています。";

            error.style.display = "block";

        } else {

            error.textContent =
                "入力内容を確認してください。";

            error.style.display = "block";
        }

    } catch (error) {

        console.error(error);

        error.textContent =
            "サーバーに接続できません。";

        error.style.display = "block";
    }

});

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>JobTrack | ログイン</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI","Noto Sans JP",Arial,sans-serif;background:#f5f8f7;color:#203331;min-height:100vh;display:grid;place-items:center}
.login-card{width:min(420px,92vw);background:#fff;border:1px solid #e3ebe9;border-radius:22px;padding:36px;box-shadow:0 14px 40px rgba(24,70,65,.10)}
.logo{text-align:center;font-size:31px;font-weight:800;color:#147d73;margin-bottom:8px}.logo span{color:#203331}.sub{text-align:center;color:#71807e;margin:0 0 28px}
.group{margin-bottom:18px}.group label{display:block;font-weight:700;margin-bottom:8px}.input{width:100%;padding:13px 14px;border:1px solid #e3ebe9;border-radius:11px;outline:none}.input:focus{border-color:#147d73}
.btn{width:100%;border:0;border-radius:11px;padding:13px;cursor:pointer;font-weight:800;background:#147d73;color:#fff}.btn:hover{background:#0d625b}
.error{color:#d9534f;background:#fff0ef;padding:11px;border-radius:10px;margin-bottom:16px;display:none;text-align:center}.demo{margin-top:18px;padding:13px;background:#e7f5f2;border-radius:11px;color:#0d625b;font-size:13px;line-height:1.6}
.register-link {
    margin-top: 20px;
    text-align: center;
    font-size: 14px;
    color: #71807e;
}

.register-link a {
    color: #147d73;
    font-weight: 700;
    text-decoration: none;
    margin-left: 5px;
}

.register-link a:hover {
    text-decoration: underline;
}</style></head><body>
<div class="login-card"><div class="logo">Job<span>Track</span></div><p class="sub">就活管理システム</p>
<div id="error" class="error">ユーザー名またはパスワードが正しくありません。</div>
<form id="loginForm"><div class="group"><label>ユーザー名</label><input id="username" class="input" required autocomplete="username" placeholder="ユーザー名"></div>
<div class="group"><label>パスワード</label><input id="password" type="password" class="input" required autocomplete="current-password" placeholder="パスワード"></div>
<button class="btn" type="submit">ログイン</button></form>
<div class="register-link">
    <span>アカウントをお持ちでない方は</span>
    <a href="/register.html">新規登録</a>
</div>
<script>document.getElementById("loginForm").addEventListener("submit", async e => {

    e.preventDefault();

    const error = document.getElementById("error");
    error.style.display = "none";

    try {

        const response = await fetch("/auth/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                username: document.getElementById("username").value.trim(),
                password: document.getElementById("password").value
            })
        });

        const result = await response.text();

        if (result === "OK") {

            // Login success
            window.location.href = "/";

        } else {

            // Login failed
            error.textContent =
                "ユーザー名またはパスワードが正しくありません。";

            error.style.display = "block";
        }

    } catch (err) {

        console.error(err);

        error.textContent =
            "サーバーに接続できません。";

        error.style.display = "block";
    }
});</script></body></html>
